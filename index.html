    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        (() => {
            "use strict";

            const pointer_dist = 190;

            const canvas = document.getElementById("bg");
            const ctx = canvas.getContext("2d", { alpha: true });

            let view_w = 0;
            let view_h = 0;
            let ratio = 1;
            let parts = [];
            let resize_timer = 0;
            let level = 0;
            let flow_t = 0;
            let last_t = 0;
            const max_parts = 210;

            const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false };

            function make_dust(core, halo) {
                const sprite = document.createElement("canvas");
                sprite.width = 48;
                sprite.height = 48;

                const g = sprite.getContext("2d");
                const grad = g.createRadialGradient(24, 24, 0, 24, 24, 24);
                grad.addColorStop(0, "rgba(" + core + ", 0.95)");
                grad.addColorStop(0.28, "rgba(" + core + ", 0.55)");
                grad.addColorStop(0.62, "rgba(" + halo + ", 0.16)");
                grad.addColorStop(1, "rgba(" + halo + ", 0)");
                g.fillStyle = grad;
                g.fillRect(0, 0, 48, 48);

                return sprite;
            }

            function make_petal(inner, outer, vein) {
                const sprite = document.createElement("canvas");
                sprite.width = 96;
                sprite.height = 96;

                const g = sprite.getContext("2d");
                g.translate(48, 48);
                g.rotate(-Math.PI / 2);

                const grad = g.createLinearGradient(0, -32, 0, 32);
                grad.addColorStop(0, inner);
                grad.addColorStop(0.72, outer);
                grad.addColorStop(1, "rgba(255, 246, 246, 0.08)");
                g.fillStyle = grad;

                g.beginPath();
                g.moveTo(0, -32);
                g.bezierCurveTo(24, -22, 29, 5, 0, 32);
                g.bezierCurveTo(-29, 5, -24, -22, 0, -32);
                g.closePath();
                g.fill();

                g.globalAlpha = 0.52;
                g.strokeStyle = vein;
                g.lineWidth = 1.1;
                g.beginPath();
                g.moveTo(0, -25);
                g.quadraticCurveTo(5, -1, 0, 24);
                g.stroke();

                g.globalAlpha = 0.4;
                g.beginPath();
                g.moveTo(0, -6);
                g.quadraticCurveTo(9, 0, 13, 11);
                g.stroke();

                return sprite;
            }

            const dusts = [
                make_dust("228, 154, 178", "245, 203, 215"),
                make_dust("236, 173, 154", "247, 213, 198"),
                make_dust("207, 157, 188", "236, 202, 220"),
            ];

            const petals = [
                make_petal("rgba(247, 193, 210, 0.92)", "rgba(228, 143, 171, 0.6)", "rgba(156, 77, 105, 0.55)"),
                make_petal("rgba(251, 220, 207, 0.88)", "rgba(236, 177, 166, 0.56)", "rgba(166, 96, 88, 0.45)"),
                make_petal("rgba(240, 208, 223, 0.86)", "rgba(211, 161, 186, 0.5)", "rgba(136, 81, 108, 0.42)"),
            ];

            function base_count() {
                return Math.max(40, Math.min(max_parts, Math.round((view_w * view_h) / 10500)));
            }

            function seed() {
                parts = Array.from({ length: base_count() }, () => make_part());
            }

            function make_part(x, y) {
                const z = 0.3 + Math.random() * 0.7;
                const petal = Math.random() < 0.2;
                const tint = Math.floor(Math.random() * (petal ? petals.length : dusts.length));

                return {
                    x: x === undefined ? Math.random() * view_w : x,
                    y: y === undefined ? Math.random() * view_h : y,
                    dir: Math.random() * Math.PI * 2,
                    spd: petal ? 16 + Math.random() * 26 + z * 16 : 34 + Math.random() * 68 + z * 24,
                    rot: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * (petal ? 1.2 : 0),
                    ix: 0,
                    iy: 0,
                    z: z,
                    tint: tint,
                    petal: petal,
                    size: petal ? 14 + Math.random() * 17 : 2.5 + Math.random() * 5.5,
                    a: petal ? 0.3 + Math.random() * 0.3 : 0.16 + Math.random() * 0.3,
                    ph: Math.random() * Math.PI * 2,
                    tw: 0.6 + Math.random() * 1.8,
                    burst: 0,
                    scared: 0,
                    life: 0,
                    dead: false,
                };
            }

            function resize() {
                ratio = Math.min(window.devicePixelRatio || 1, 2);
                view_w = window.innerWidth;
                view_h = window.innerHeight;
                canvas.width = Math.round(view_w * ratio);
                canvas.height = Math.round(view_h * ratio);
                ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                seed();
            }

            function schedule_resize() {
                clearTimeout(resize_timer);
                resize_timer = setTimeout(resize, 120);
            }

            function edge_fade(x, y) {
                const margin = 60;
                const dx = Math.min(x, view_w - x);
                const dy = Math.min(y, view_h - y);
                const near = Math.min(dx, dy);

                if (near >= margin) return 1;
                if (near <= 0) return 0;

                const t = near / margin;
                return t * t * (3 - 2 * t);
            }

            function step() {
                ctx.clearRect(0, 0, view_w, view_h);

                const now_t = performance.now();
                const dt = last_t ? Math.min(0.05, (now_t - last_t) / 1000) : 0.016;
                last_t = now_t;

                const beat = level * level * (3 - 2 * level);
                let dirty = false;

                flow_t += dt * (0.55 + beat * 1.1);

                if (pointer.active) {
                    const follow = Math.min(1, dt * 22);
                    pointer.x += (pointer.tx - pointer.x) * follow;
                    pointer.y += (pointer.ty - pointer.y) * follow;
                }

                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];

                    if (p.burst) {
                        p.size += dt * 40;
                        if (p.size > 44) p.burst = 0;
                    }

                    if (p.life > 0) {
                        p.life -= dt * 0.85;
                        if (p.life <= 0) {
                            p.dead = true;
                            dirty = true;
                            continue;
                        }
                    }

                    p.rot += p.spin * dt * (1 + beat * 1.4);

                    const wobble = flow_t + p.ph;
                    const curl =
                        Math.sin(p.y * 0.0042 + wobble) +
                        Math.cos(p.x * 0.0035 - wobble * 0.7 + p.ph * 1.7);

                    p.dir += curl * dt * (p.petal ? 1.5 : 2.2 + beat * 2.4);

                    const sp = p.spd * (0.8 + p.z * 0.9) * (1 + beat * 1.9);
                    const drift_x = Math.cos(p.dir) * sp;
                    const drift_y = Math.sin(p.dir) * sp - (p.petal ? 9 : 6) * p.z;

                    p.ix *= Math.pow(0.9, dt * 60);
                    p.iy *= Math.pow(0.9, dt * 60);

                    if (pointer.active) {
                        const dx = p.x - pointer.x;
                        const dy = p.y - pointer.y;
                        const d = Math.hypot(dx, dy);

                        if (d < pointer_dist) {
                            const near = 1 - d / pointer_dist;

                            if (d > 0.01) {
                                p.ix += (dx / d) * near * near * 1300 * dt;
                                p.iy += (dy / d) * near * near * 1300 * dt;
                            } else {
                                p.ix += (Math.random() - 0.5) * 500 * dt;
                                p.iy += (Math.random() - 0.5) * 500 * dt;
                            }

                            p.scared = Math.min(1, p.scared + near * dt * 5);
                        } else {
                            p.scared *= 1 - Math.min(1, dt * 2.6);
                        }
                    } else {
                        p.scared *= 1 - Math.min(1, dt * 2.6);
                    }

                    p.ix = Math.max(-480, Math.min(480, p.ix));
                    p.iy = Math.max(-480, Math.min(480, p.iy));

                    p.x += (drift_x + p.ix) * dt;
                    p.y += (drift_y + p.iy) * dt;

                    const margin = 40;

                    if (p.x < -margin) p.x = view_w + margin;
                    else if (p.x > view_w + margin) p.x = -margin;

                    if (p.y < -margin) p.y = view_h + margin;
                    else if (p.y > view_h + margin) p.y = -margin;

                    const fade = edge_fade(p.x, p.y) * (p.life > 0 ? p.life : 1);

                    if (fade <= 0.005) continue;

                    const twinkle = 0.78 + 0.22 * Math.sin(flow_t * p.tw * 2 + p.ph * 3);

                    if (p.petal) {
                        const a = Math.min(0.62, p.a * twinkle * (0.8 + beat * 0.35) * (1 + p.scared * 0.2) * fade);
                        const size = p.size * (1 + beat * 0.18 + p.scared * 0.25);

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.globalAlpha = a;
                        ctx.drawImage(petals[p.tint], -size / 2, -size / 2, size, size);
                        ctx.restore();
                    } else {
                        const a = Math.min(0.58, p.a * twinkle * (0.72 + beat * 0.55) * fade);
                        const size = p.size * (1 + beat * 0.5 + p.scared * 0.4);

                        ctx.globalAlpha = a;
                        ctx.drawImage(dusts[p.tint], p.x - size / 2, p.y - size / 2, size, size);
                    }
                }

                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = "source-over";

                if (dirty) parts = parts.filter((p) => !p.dead);

                requestAnimationFrame(step);
            }

            function move_pointer(e) {
                const t = e.touches ? e.touches[0] : e;
                if (!t) return;

                pointer.tx = t.clientX;
                pointer.ty = t.clientY;

                if (!pointer.active) {
                    pointer.x = pointer.tx;
                    pointer.y = pointer.ty;
                }

                pointer.active = true;
            }

            function pop_particle(x, y) {
                const p = make_part(x, y);
                p.size = 16 + Math.random() * 10;
                p.a = 0.82;
                p.spd = 18;
                p.ix = (Math.random() - 0.5) * 280;
                p.iy = (Math.random() - 0.5) * 280;
                p.burst = 1;
                p.life = 1;

                parts.push(p);

                while (parts.length > max_parts) parts.shift();
            }

            function on_press(e) {
                move_pointer(e);

                if (e.target.closest(".links, .player, .toast, button, a, input")) return;
                pop_particle(pointer.x, pointer.y);
            }

            addEventListener("pointermove", move_pointer, { passive: true });
            addEventListener("pointerdown", on_press, { passive: true });
            addEventListener("blur", () => (pointer.active = false));
            addEventListener("resize", schedule_resize);

            if (window.visualViewport) {
                visualViewport.addEventListener("resize", schedule_resize);
            }

            resize();
            requestAnimationFrame(step);

            const page_title = "firox.dev";
            const page_loaded = Date.now();
            let title_timer = 0;

            function run_title() {
                const full = page_title;
                const frames = [];
                let at = 0;

                for (let i = 1; i <= full.length; i++) frames.push(full.slice(0, i));
                for (let i = full.length - 1; i >= 1; i--) frames.push(full.slice(0, i));

                const dwell = [190, 105, 82, 68, 62, 78, 66, 58];

                let frame_at = 0;

                const tick = () => {
                    if (frame_at < frames.length) {
                        document.title = frames[frame_at];

                        const at_full = frame_at === full.length - 1;
                        const at_min = frame_at === full.length;
                        const step = frame_at % dwell.length;

                        frame_at++;
                        title_timer = setTimeout(
                            tick,
                            at_full ? 1650 : at_min ? 520 : dwell[step] + Math.random() * 90
                        );
                        return;
                    }

                    frame_at = 0;
                    title_timer = setTimeout(tick, 520);
                };

                tick();
            }

            const rotator = document.getElementById("rotator");
            const lines = [
                "probably building something",
                "smoking loud",
                "sleep is optional",
                "definitely running it up",
                "shipping at 3am",
                "professional pasta chef",
            ];

            let line_at = 0;
            let char_at = 0;
            let erasing = false;
            let typing_timer = 0;

            function type_line() {
                const line = lines[line_at];

                if (!erasing) {
                    char_at++;
                    rotator.textContent = line.slice(0, char_at);

                    if (char_at >= line.length) {
                        erasing = true;
                        typing_timer = setTimeout(type_line, 1900);
                        return;
                    }

                    typing_timer = setTimeout(type_line, 42 + Math.random() * 62);
                    return;
                }

                char_at--;
                rotator.textContent = line.slice(0, char_at);

                if (char_at <= 0) {
                    erasing = false;
                    line_at = (line_at + 1) % lines.length;
                    typing_timer = setTimeout(type_line, 420);
                    return;
                }

                typing_timer = setTimeout(type_line, 20);
            }

            type_line();
            run_title();

            document.addEventListener("visibilitychange", () => {
                clearTimeout(typing_timer);
                clearTimeout(title_timer);
                if (document.hidden) return;
                type_line();
                run_title();
            });

            const toast_el = document.getElementById("toast");
            let toast_timer = 0;
            function toast(message) {
                toast_el.textContent = message;
                toast_el.classList.add("show");
                clearTimeout(toast_timer);
                toast_timer = setTimeout(() => toast_el.classList.remove("show"), 1800);
            }

            async function copy_text(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (err) {}

                try {
                    const field = document.createElement("textarea");
                    field.value = text;
                    field.setAttribute("readonly", "");
                    field.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
                    document.body.appendChild(field);
                    field.select();
                    field.setSelectionRange(0, text.length);
                    const done = document.execCommand("copy");
                    document.body.removeChild(field);
                    return done;
                } catch (err) {
                    return false;
                }
            }

            const copy_btn = document.getElementById("copy");

            copy_btn.addEventListener("click", async (e) => {
                e.preventDefault();
                const value = copy_btn.dataset.copy;
                toast((await copy_text(value)) ? "copied " + value : value);
            });

            const discord_scrap = document.getElementById("discord_scrap");
            const discord_avatar = document.getElementById("discord_avatar");
            const discord_dot = document.getElementById("discord_dot");
            const discord_name = document.getElementById("discord_name");
            const discord_tag = document.getElementById("discord_tag");
            const discord_text = discord_scrap.querySelector(".discord_text");
            const discord_line = document.getElementById("discord_line");
            const discord_activity = document.getElementById("discord_activity");
            const discord_art = document.getElementById("discord_art");
            const discord_emoji = document.getElementById("discord_emoji");

            const discord_page = "https://e-z.bio/ioctl";
            const discord_socket_url = "wss://api.e-z.bio/bio/presence/ioctl";
            const discord_cache_key = "firox_discord_snapshot_v2";
            const discord_cache_ms = 90000;
            const discord_status_words = {
                online: "online",
                idle: "idle",
                dnd: "do not disturb",
                offline: "offline",
            };

            let discord_socket = null;
            let discord_retry = 0;
            let discord_retry_timer = 0;
            let discord_live_seen = false;
            let discord_display_name = "Firox";

            function safe_image(url) {
                if (typeof url !== "string") return "";
                if (!url.startsWith("https://")) return "";
                return url;
            }

            function snapshot_from_html(text) {
                const match = text.match(/<script id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
                if (!match) return null;

                try {
                    const data = JSON.parse(match[1]);
                    const page = data && data.props && data.props.pageProps;

                    if (!page || !page.bio || !page.bio.bio_presence) return null;

                    return {
                        presence: page.bio.bio_presence,
                        display_name: typeof page.bio.name === "string" ? page.bio.name.trim() : "",
                    };
                } catch (err) {
                    return null;
                }
            }

            function apply_discord(data) {
                if (!data) return;

                if (data.pfp) {
                    const avatar_src = safe_image(data.pfp);
                    if (avatar_src) discord_avatar.src = avatar_src;
                }

                discord_name.textContent = discord_display_name;

                if (data.tag) {
                    const tag = String(data.tag).replace(/^@+/, "").trim();
                    if (tag) discord_tag.textContent = "(@" + tag + ")";
                }

                const status = typeof data.status === "string" ? data.status : "offline";
                discord_dot.hidden = false;
                discord_dot.setAttribute("data_status", status);

                const custom = data.customStatus;
                const activities = Array.isArray(data.activities) ? data.activities.filter(Boolean) : [];
                const first = activities[0] || null;

                let line = discord_status_words[status] || status;
                let activity_text = "";
                let art_url = "";
                let emoji_url = "";

                if (custom && typeof custom.name === "string" && custom.name.trim()) {
                    line = custom.name.trim();
                    if (custom.emoji) emoji_url = custom.emoji;
                } else if (first) {
                    line = first.details || first.name || line;
                }

                if (first) {
                    const bits = [];
                    const name = typeof first.name === "string" ? first.name.trim() : "";
                    const details = typeof first.details === "string" ? first.details.trim() : "";
                    const state = typeof first.state === "string" ? first.state.trim() : "";

                    if (name) bits.push(name);
                    if (details && details !== line) bits.push(details);
                    if (state) bits.push(state);

                    activity_text = bits.join(" · ");

                    if (first.assets) {
                        art_url = first.assets.largeImage || first.assets.smallImage || "";

                        const large_text =
                            typeof first.assets.largeText === "string" ? first.assets.largeText.trim() : "";

                        if (large_text && large_text !== name && large_text !== details) {
                            activity_text = activity_text ? activity_text + " · " + large_text : large_text;
                        }
                    }
                }

                discord_line.textContent = line;
                discord_activity.textContent = activity_text;
                discord_activity.hidden = !activity_text;

                const emoji_src = safe_image(emoji_url);
                if (emoji_src) {
                    discord_emoji.src = emoji_src;
                    discord_emoji.hidden = false;
                } else {
                    discord_emoji.hidden = true;
                    discord_emoji.removeAttribute("src");
                }

                const art_src = safe_image(art_url);
                if (art_src) {
                    discord_art.src = art_src;
                    discord_art.hidden = false;
                } else {
                    discord_art.hidden = true;
                    discord_art.removeAttribute("src");
                }

                requestAnimationFrame(fit_discord_art);
            }

            function fit_discord_art() {
                if (discord_art.hidden) return;

                const text_box = discord_text.getBoundingClientRect();
                if (!text_box.height) return;

                const size = Math.min(Math.max(text_box.height, 40), 68);

                discord_art.style.width = size + "px";
                discord_art.style.height = size + "px";
                discord_art.style.aspectRatio = "1";
                discord_art.style.alignSelf = "center";
                discord_art.style.transform = "none";

                const settled = discord_text.getBoundingClientRect();
                const art_box = discord_art.getBoundingClientRect();
                const offset = settled.top + (settled.height - art_box.height) / 2 - art_box.top;
                discord_art.style.transform = "translateY(" + offset + "px)";
            }

            function read_discord_cache() {
                try {
                    const raw = sessionStorage.getItem(discord_cache_key);
                    if (!raw) return null;

                    const parsed = JSON.parse(raw);
                    if (!parsed || !parsed.at || !parsed.presence) return null;
                    if (Date.now() - parsed.at > discord_cache_ms) return null;

                    return parsed;
                } catch (err) {
                    return null;
                }
            }

            function cache_discord(presence, display_name) {
                try {
                    sessionStorage.setItem(
                        discord_cache_key,
                        JSON.stringify({ at: Date.now(), presence: presence, display_name: display_name })
                    );
                } catch (err) {}
            }

            async function load_discord_snapshot() {
                const cached = read_discord_cache();
                if (cached) {
                    if (cached.display_name) {
                        discord_display_name = cached.display_name;
                        discord_name.textContent = discord_display_name;
                    }
                    apply_discord(cached.presence);
                    return;
                }

                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 10000);

                try {
                    const res = await fetch("https://r.jina.ai/" + discord_page, {
                        headers: { "x-respond-with": "html" },
                        signal: controller.signal,
                    });

                    if (!res.ok) throw new Error("http " + res.status);

                    const html = await res.text();
                    const snapshot = snapshot_from_html(html);
                    if (!snapshot) throw new Error("presence missing");

                    if (snapshot.display_name) {
                        discord_display_name = snapshot.display_name;
                        discord_name.textContent = discord_display_name;
                    }

                    if (!discord_live_seen) {
                        apply_discord(snapshot.presence);
                        cache_discord(snapshot.presence, discord_display_name);
                    }
                } catch (err) {
                    console.warn("discord snapshot failed: " + err.message);
                } finally {
                    clearTimeout(timer);
                }
            }

            function schedule_discord_retry() {
                if (discord_retry_timer) return;

                const delay = Math.min(60000, 4000 * Math.pow(2, discord_retry));
                discord_retry = Math.min(discord_retry + 1, 5);

                discord_retry_timer = setTimeout(() => {
                    discord_retry_timer = 0;
                    if (!document.hidden) connect_discord();
                }, delay);
            }

            function connect_discord() {
                if (!("WebSocket" in window)) return;
                if (discord_socket && (discord_socket.readyState === 0 || discord_socket.readyState === 1)) return;

                try {
                    discord_socket = new WebSocket(discord_socket_url);
                } catch (err) {
                    schedule_discord_retry();
                    return;
                }

                discord_socket.addEventListener("open", () => {
                    discord_retry = 0;
                    try {
                        discord_socket.send("Connection established");
                    } catch (err) {}
                });

                discord_socket.addEventListener("message", (event) => {
                    if (event.data === "connected") return;

                    try {
                        const data = JSON.parse(String(event.data));
                        discord_live_seen = true;
                        apply_discord(data);
                        cache_discord(data, discord_display_name);
                    } catch (err) {}
                });

                discord_socket.addEventListener("close", () => {
                    discord_socket = null;
                    if (document.hidden) return;
                    schedule_discord_retry();
                });

                discord_socket.addEventListener("error", () => {
                    try {
                        discord_socket.close();
                    } catch (err) {}
                });
            }

            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) connect_discord();
            });

            addEventListener("resize", () => requestAnimationFrame(fit_discord_art), { passive: true });

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(fit_discord_art).catch(() => {});
            }

            load_discord_snapshot();
            connect_discord();

            const audio = document.getElementById("audio");
            const root = document.documentElement;

            const player = document.getElementById("player");
            const cover = document.getElementById("cover");
            const artist_el = document.getElementById("artist");
            const song_el = document.getElementById("song");
            const play_btn = document.getElementById("play");
            const back_btn = document.getElementById("back");
            const fwd_btn = document.getElementById("fwd");
            const mute_btn = document.getElementById("mute");
            const vol_range = document.getElementById("vol_range");
            const seek = document.getElementById("seek");
            const wave = document.getElementById("wave");
            const wave_ctx = wave.getContext("2d");
            const time_now = document.getElementById("time_now");
            const time_end = document.getElementById("time_end");

            const song_folder = "assets/Songs";
            const repo_api = "https://api.github.com/repos/FlR0x/my-website/contents/";
            const repo_raw = "https://raw.githubusercontent.com/FlR0x/my-website/main/";
            const cdn_base = "https://cdn.jsdelivr.net/gh/FlR0X/my-website@main/";
            const cache_key = "firox_songs_v3";
            let songs = [];

            function source_url(file) {
                const path = song_folder + "/" + file.name;
                const encoded = path.split("/").map(encodeURIComponent).join("/");

                // raw.github sends an unquoted filename with commas, which Chromium rejects
                if (file.name.indexOf(",") !== -1) return cdn_base + encoded;

                return file.download_url || repo_raw + encoded;
            }

            function split_name(stem) {
                const cut = stem.indexOf(" - ");

                if (cut > 0) {
                    return { artist: stem.slice(0, cut).trim(), title: stem.slice(cut + 3).trim() };
                }

                return { artist: "", title: stem };
            }

            function fold(text) {
                return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
            }

            function loose(text) {
                return fold(text).replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
            }

            function find_cover(stem, covers) {
                return covers.get(fold(stem)) || covers.get(loose(stem)) || "";
            }

            function build_from_listing(files) {
                const tracks = new Map();
                const covers = new Map();

                for (const f of files) {
                    if (f.type !== "file") continue;

                    if (/\.mp3$/i.test(f.name)) {
                        const stem = f.name.replace(/\.mp3$/i, "");
                        tracks.set(stem, source_url(f));
                    }

                    if (/\.(jpe?g|png|webp)$/i.test(f.name)) {
                        const base = f.name.replace(/\.(jpe?g|png|webp)$/i, "");
                        const url = source_url(f);
                        covers.set(fold(base), url);
                        covers.set(loose(base), url);
                    }
                }

                const built = [];

                for (const [stem, url] of tracks) {
                    const names = split_name(stem);

                    built.push({
                        artist: names.artist,
                        title: names.title,
                        file: url,
                        cover: find_cover(stem, covers),
                    });
                }

                built.sort((a, b) => a.title.localeCompare(b.title));
                return built;
            }

            async function load_songs() {
                try {
                    const cached = localStorage.getItem(cache_key);
                    const age = cached ? Date.now() - Number(JSON.parse(cached).at) : Infinity;

                    if (cached && age < 900000) {
                        const parsed = JSON.parse(cached);
                        if (Array.isArray(parsed.list) && parsed.list.length) {
                            songs = parsed.list;
                            console.log("songs loaded from cache: " + songs.length);
                            return;
                        }
                    }
                } catch (err) {}

                try {
                    let built = null;
                    let last_error = null;

                    for (let attempt = 0; attempt < 3 && !built; attempt++) {
                        try {
                            const res = await fetch(repo_api + song_folder + "?ref=main", {
                                headers: { Accept: "application/vnd.github+json" },
                            });

                            if (!res.ok) throw new Error("http " + res.status);

                            const files = await res.json();
                            built = build_from_listing(files);

                            if (!built.length) throw new Error("no tracks found");
                        } catch (err) {
                            last_error = err;
                            if (attempt < 2) {
                                await new Promise((resolve) => setTimeout(resolve, 900 * (attempt + 1)));
                            }
                        }
                    }

                    if (!built) throw last_error || new Error("no tracks found");

                    songs = built;
                    localStorage.setItem(cache_key, JSON.stringify({ at: Date.now(), list: built }));
                    console.log("songs discovered from repo: " + songs.length);
                } catch (err) {
                    console.warn("song discovery failed: " + err.message);
                }
            }

            cover.addEventListener("error", () => {
                if (cover.src.endsWith("astolfo_pink.png")) return;
                cover.src = "assets/astolfo_pink.png";
            });

            let song_at = 0;
            const history = [];
            let history_at = -1;

            function remember(index) {
                history.length = history_at + 1;
                history.push(index);
                history_at = history.length - 1;
            }

            function go(index, autoplay) {
                remember(index);
                load_song(index, autoplay);
            }

            function go_next(autoplay) {
                if (history_at < history.length - 1) {
                    history_at++;
                    load_song(history[history_at], autoplay);
                    return;
                }

                if (!songs.length) return;
                go((song_at + 1) % songs.length, autoplay);
            }

            function go_back(autoplay) {
                if (history_at > 0) {
                    history_at--;
                    load_song(history[history_at], autoplay);
                    return history[history_at];
                }

                if (!songs.length) return null;
                go((song_at - 1 + songs.length) % songs.length, autoplay);
                return song_at;
            }

            audio.volume = 0.12;
            if (location.protocol !== "file:") audio.crossOrigin = "anonymous";

            let audio_ctx = null;
            let analyser = null;
            let bins = null;
            let smooth = 0;
            let peak = 0.02;
            let low = 1;
            let high = 0;
            let meter_frame = 0;
            let dragging = false;
            let loading_song = false;
            let play_token = 0;
            let load_token = 0;
            let song_token = 0;
            const broken_tracks = [];

            function load_song(index, autoplay) {
                if (!songs.length) return;

                song_at = (index + songs.length) % songs.length;
                const song = songs[song_at];

                load_token++;
                loading_song = true;

                cover.src = song.cover || "assets/astolfo_pink.png";
                artist_el.textContent = song.artist;
                song_el.textContent = song.title;
                audio.src = song.file;
                audio.currentTime = 0;
                shape_seed = hash_seed(song.file);
                shape_wave(shape_seed);
                smooth_progress = 0;
                sync();

                if (autoplay) play_audio();
            }

            function format_time(seconds) {
                if (!isFinite(seconds) || seconds < 0) return "0:00";
                const whole = Math.floor(seconds);
                const mins = Math.floor(whole / 60);
                const secs = whole % 60;
                return mins + ":" + String(secs).padStart(2, "0");
            }

            const wave_shape = [];
            const wave_freq = [];
            let wave_bars = 0;
            let shape_seed = 1;
            let wave_w = 0;
            let wave_h = 0;

            function hash_seed(text) {
                let h = 2166136261;

                for (let i = 0; i < text.length; i++) {
                    h ^= text.charCodeAt(i);
                    h = Math.imul(h, 16777619);
                }

                return h >>> 0;
            }

            function shape_wave(seed) {
                let s = seed || 1;
                const rand = () => {
                    s ^= s << 13; s >>>= 0;
                    s ^= s >> 17;
                    s ^= s << 5; s >>>= 0;
                    return s / 4294967296;
                };

                const pick = (a) => a[Math.floor(rand() * a.length)];

                const sections = [];
                let at = 0;

                const push = (len, kind) => {
                    sections.push({ start: at, end: at + len, kind: kind });
                    at += len;
                };

                push(0.04 + rand() * 0.05, "silence");
                push(0.07 + rand() * 0.05, "quiet");

                let drops = 2 + Math.floor(rand() * 2);

                while (at < 0.94 && drops > 0) {
                    const verse = 0.06 + rand() * 0.07;
                    push(verse, pick(["verse", "verse", "chill"]));

                    const build = 0.03 + rand() * 0.04;
                    push(build, "build");

                    const drop = 0.09 + rand() * 0.1;
                    push(drop, "drop");
                    drops--;

                    if (drops > 0 && rand() < 0.8) push(0.03 + rand() * 0.04, "break");
                    if (drops > 0) push(0.05 + rand() * 0.05, pick(["verse", "chill"]));
                }

                if (at < 1) push(1 - at, "outro");

                const energy = { silence: 0.05, quiet: 0.16, verse: 0.42, chill: 0.34, build: 0.6, drop: 1, break: 0.26, outro: 0.2 };
                const beats = 46 + Math.floor(rand() * 26);
                const phase = rand() * 6.2831853;

                const at_t = (t) => {
                    for (const g of sections) {
                        if (t >= g.start && t < g.end) {
                            const span = g.end - g.start;
                            const local = span > 0 ? (t - g.start) / span : 0;
                            let v = energy[g.kind];

                            if (g.kind === "drop") {
                                v *= 0.86 + 0.14 * Math.sin(local * Math.PI);
                            } else if (g.kind === "build") {
                                v *= 0.42 + 0.58 * local * local;
                            } else if (g.kind === "silence") {
                                v *= 0.5 + 0.5 * local;
                            } else if (g.kind === "outro") {
                                v *= 1 - local * 0.75;
                            } else {
                                v *= 0.88 + 0.12 * Math.sin(local * Math.PI * 2);
                            }

                            return Math.max(0.02, Math.min(1, v));
                        }
                    }
                    return 0.1;
                };

                wave_shape.length = 0;
                wave_freq.length = 0;

                for (let i = 0; i < wave_bars; i++) {
                    const t = (i + 0.5) / wave_bars;
                    const base = at_t(t);

                    const beat_pos = (t * beats) % 1;
                    const transient = Math.pow(1 - beat_pos, 2.6) * 0.34;
                    const body = 0.76 + 0.24 * Math.sin(t * beats * 3.14159 + phase);
                    const texture = 0.9 + 0.1 * Math.sin(t * 87.3 + phase * 3);

                    const v = base * (body + transient * base) * texture;
                    wave_shape.push(Math.max(0.025, Math.min(1, v)));

                    const spread = Math.sqrt(Math.max(0, 1 - Math.abs(t - 0.5) * 2));
                    wave_freq.push(Math.min(1, spread * (0.55 + 0.45 * Math.sin(t * 8.9 + phase))));
                }
            }

            function build_wave() {
                const box = wave.getBoundingClientRect();
                const dpr_now = Math.min(window.devicePixelRatio || 1, 2);

                wave_w = Math.max(1, Math.round(box.width));
                wave_h = Math.max(1, Math.round(box.height));
                wave.width = Math.round(wave_w * dpr_now);
                wave.height = Math.round(wave_h * dpr_now);
                wave_ctx.setTransform(dpr_now, 0, 0, dpr_now, 0, 0);

                const gap = 2;
                const next_bars = Math.max(12, Math.floor((wave_w + gap) / (3 + gap)));

                if (next_bars !== wave_bars) {
                    wave_bars = next_bars;
                    shape_wave(shape_seed);
                } else if (!wave_shape.length) {
                    shape_wave(shape_seed);
                }
            }

            function draw_wave() {
                if (!wave_bars) return;

                const total = isFinite(audio.duration) ? audio.duration : 0;
                const now = audio.currentTime || 0;
                const progress = total ? Math.min(1, now / total) : 0;
                const rate = progress > smooth_progress ? 0.34 : 0.9;
                smooth_progress += (progress - smooth_progress) * rate;
                if (Math.abs(progress - smooth_progress) < 0.0004) smooth_progress = progress;
                wave_ctx.clearRect(0, 0, wave_w, wave_h);

                const mid = wave_h / 2;
                const max_h = wave_h * 0.5;
                const bar_w = Math.max(1.5, (wave_w - (wave_bars - 1) * 2) / wave_bars);
                const edge = smooth_progress * wave_bars;

                wave_ctx.fillStyle = "rgba(94, 55, 69, 0.09)";
                wave_ctx.fillRect(0, mid - 0.5, wave_w, 1);

                for (let i = 0; i < wave_bars; i++) {
                    const h = Math.max(1.5, wave_shape[i] * max_h);
                    const x = i * (bar_w + 2);
                    const dist = edge - i;

                    const fade = Math.max(0, Math.min(1, dist + 0.5));
                    const a = 0.24 + 0.66 * fade;

                    wave_ctx.fillStyle =
                        fade > 0.5
                            ? "rgba(177, 75, 108, " + a.toFixed(3) + ")"
                            : "rgba(112, 76, 89, 0.18)";

                    const bar_h = h * 2;
                    wave_ctx.beginPath();
                    wave_ctx.roundRect(x, mid - bar_h / 2, bar_w, bar_h, bar_w / 2);
                    wave_ctx.fill();
                }

                const head_x = Math.max(0.75, Math.min(wave_w - 0.75, smooth_progress * wave_w));

                wave_ctx.strokeStyle = "rgba(155, 54, 88, 0.58)";
                wave_ctx.lineWidth = 1.4;
                wave_ctx.beginPath();
                wave_ctx.moveTo(head_x, mid - max_h * 0.98);
                wave_ctx.lineTo(head_x, mid + max_h * 0.98);
                wave_ctx.stroke();

                wave_ctx.fillStyle = "rgba(168, 62, 97, 0.9)";
                wave_ctx.beginPath();
                wave_ctx.arc(head_x, mid - max_h * 0.98, 2.1, 0, Math.PI * 2);
                wave_ctx.fill();
            }

            let smooth_progress = 0;
            let wave_frame = 0;

            function loop_wave() {
                draw_wave();
                wave_frame = requestAnimationFrame(loop_wave);
            }

            function sync() {
                const total = isFinite(audio.duration) ? audio.duration : 0;
                const now = audio.currentTime || 0;

                time_now.textContent = format_time(now);
                time_end.textContent = format_time(total);

                seek.setAttribute("aria-valuenow", String(Math.floor(now)));
                seek.setAttribute("aria-valuemax", String(Math.floor(total)));

                const playing = !audio.paused && !audio.ended;
                player.classList.toggle("playing", playing);
                player.classList.toggle("pulsing", playing && level > 0.04);
                play_btn.setAttribute("aria-label", playing ? "pause" : "play");
                play_btn.title = playing ? "pause" : "play";
                mute_btn.setAttribute("aria-label", audio.muted ? "unmute" : "mute");
                mute_btn.title = audio.muted ? "unmute" : "mute";
                mute_btn.classList.toggle("off", audio.muted || audio.volume === 0);
                vol_range.style.setProperty("--level", String(audio.muted ? 0 : Math.round(audio.volume * 100)));
            }

            function track_player() {
                const box = player.getBoundingClientRect();
                if (box.height) root.style.setProperty("--player_h", box.height.toFixed(1) + "px");
            }

            function meter() {
                if (analyser && !document.hidden) {
                    analyser.getByteTimeDomainData(bins);

                    let sum = 0;
                    for (let i = 0; i < bins.length; i++) {
                        const v = (bins[i] - 128) / 128;
                        sum += v * v;
                    }

                    const rms = Math.sqrt(sum / bins.length);
                    peak = Math.max(rms, peak * 0.9993);
                    const gain = Math.min(60, Math.max(3, 0.88 / Math.max(peak, 0.0005)));
                    const raw = Math.min(1, Math.pow(rms * gain, 1.15));

                    if (raw < low) low = raw;
                    else low += 0.0006 * (raw - low);

                    if (raw > high) high = raw;
                    else high += 0.0004 * (raw - high);

                    const width = Math.max(0.1, high - low);
                    const level_now = Math.max(0, Math.min(1, (raw - low) / width));
                    smooth += (level_now - smooth) * (level_now > smooth ? 0.6 : 0.06);
                } else {
                    smooth += (0 - smooth) * 0.06;
                }

                level = smooth;
                root.style.setProperty("--pulse", smooth.toFixed(3));
                meter_frame = requestAnimationFrame(meter);
            }

            function start_audio() {
                const audio_context_class = window.AudioContext || window.webkitAudioContext;
                const can_analyse = location.protocol !== "file:";

                if (can_analyse && audio_context_class && !audio_ctx) {
                    audio_ctx = new audio_context_class();
                    analyser = audio_ctx.createAnalyser();
                    analyser.fftSize = 512;
                    bins = new Uint8Array(analyser.fftSize);

                    const source = audio_ctx.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audio_ctx.destination);
                }

                if (audio_ctx && audio_ctx.state === "suspended") audio_ctx.resume();

                return audio.play();
            }

            function play_audio() {
                if (!audio.src) return;

                const token = ++play_token;

                try {
                    start_audio().then(
                        () => {
                            if (token === play_token && !meter_frame) {
                                meter_frame = requestAnimationFrame(meter);
                            }
                        },
                        (err) => {
                            if (token !== play_token) return;
                            if (err && err.name === "AbortError") return;

                            console.warn("playback rejected:", err && err.name);
                            toast("browser blocked audio, press play");
                        }
                    );
                } catch (err) {
                    toast("browser blocked audio, press play");
                }
            }

            function skip(seconds) {
                const total = isFinite(audio.duration) ? audio.duration : 0;
                const next = (audio.currentTime || 0) + seconds;
                audio.currentTime = Math.max(0, total ? Math.min(total, next) : next);
                sync();
            }

            function seek_to(e) {
                const total = isFinite(audio.duration) ? audio.duration : 0;
                if (!total) return;

                const box = wave.getBoundingClientRect();
                const ratio_x = (e.clientX - box.left) / box.width;
                audio.currentTime = Math.max(0, Math.min(1, ratio_x)) * total;
            }

            play_btn.addEventListener("click", () => {
                if (audio.paused) {
                    play_audio();
                } else {
                    audio.pause();
                }
            });
back_btn.addEventListener("click", () => {
                if ((audio.currentTime || 0) > 3) {
                    audio.currentTime = 0;
                    sync();
                    return;
                }

                if (go_back(!audio.paused) === null) {
                    toast("no earlier track");
                }
            });

            fwd_btn.addEventListener("click", () => go_next(!audio.paused));

            addEventListener("keydown", (event) => {
                if (event.code !== "Space" && event.key !== " ") return;
                if (event.repeat) return;

                const target = event.target;
                if (target instanceof HTMLElement) {
                    const tag = target.tagName;
                    if (
                        tag === "INPUT" ||
                        tag === "TEXTAREA" ||
                        tag === "SELECT" ||
                        tag === "BUTTON" ||
                        target.isContentEditable
                    ) {
                        return;
                    }
                }

                event.preventDefault();

                if (audio.paused) play_audio();
                else audio.pause();
            });

            mute_btn.addEventListener("click", () => {
                audio.muted = !audio.muted;
                if (!audio.muted && audio.volume === 0) audio.volume = 0.12;
                vol_range.value = String(Math.round(audio.volume * 100));
                sync();
            });

            vol_range.addEventListener("input", () => {
                const value = Number(vol_range.value);
                audio.volume = value / 100;
                audio.muted = value === 0;
                sync();
            });

            seek.addEventListener("pointerdown", (e) => {
                dragging = true;
                try {
                    seek.setPointerCapture(e.pointerId);
                } catch (err) {}
                seek_to(e);
                sync();
            });

            seek.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                seek_to(e);
                sync();
            });

            const end_drag = (e) => {
                dragging = false;
                try {
                    seek.releasePointerCapture(e.pointerId);
                } catch (err) {}
            };

            seek.addEventListener("pointerup", end_drag);
            seek.addEventListener("pointercancel", end_drag);

            seek.addEventListener("keydown", (e) => {
                if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
                e.preventDefault();
                skip(e.key === "ArrowLeft" ? -5 : 5);
            });

            for (const name of ["timeupdate", "durationchange", "loadedmetadata", "play", "pause", "ended", "volumechange"]) {
                audio.addEventListener(name, sync);
            }

            audio.addEventListener("ended", () => go_next(true));

            audio.addEventListener("error", () => {
                loading_song = false;

                if (!songs.length) return;

                const code = audio.error ? audio.error.code : 0;
                if (code === 1) return;

                const resume = !audio.paused;
                const broken = songs[song_at].file;

                if (!broken_tracks.includes(broken)) {
                    broken_tracks.push(broken);
                    console.warn("track failed to load, skipping: " + broken + " (code " + code + ")");
                }

                if (broken_tracks.length >= songs.length) {
                    song_el.textContent = "no tracks could load";
                    sync();
                    return;
                }

                load_song(song_at + 1, resume);
            });

            audio.addEventListener("loadedmetadata", () => {
                loading_song = false;
                song_token = load_token;
                sync();
            });

            if (window.ResizeObserver) {
                const observe = new ResizeObserver(() => {
                    track_player();
                    build_wave();
                });
                observe.observe(player);
                observe.observe(wave);
            } else {
                addEventListener("resize", () => {
                    track_player();
                    build_wave();
                });
            }

            track_player();
            build_wave();
            loop_wave();
            meter();
            sync();

            load_songs().then(() => {
                if (!songs.length) {
                    song_el.textContent = "no tracks found";
                    sync();
                    return;
                }

                if (!audio.src) go(Math.floor(Math.random() * songs.length), false);
                sync();
            });
        })();
    </script>
</body>

</html>
